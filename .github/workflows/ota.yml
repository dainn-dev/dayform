name: OTA update

# Publishes the JavaScript of the current commit as an over-the-air update for the APK whose version equals
# `expo.version` in packages/mobile/app.json (runtimeVersion policy "appVersion"). Run it by hand:
#   GitHub -> Actions -> "OTA update" -> Run workflow
# Only JavaScript, assets and strings can change this way. Anything native (Kotlin, permissions, icons, app.json,
# a new native library, an Expo SDK upgrade) needs a new APK: bump the version and push a `vX.Y.Z` tag instead.
# The site serves ONE runtime version at a time: the newest published one. Older APKs just see "up to date".

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ota-update
  cancel-in-progress: false

jobs:
  publish:
    name: Test, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NODE_ENV: production
      OTA_BASE_URL: https://dayform-updates.pages.dev
      OTA_PROJECT: dayform-updates
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing secrets are present
        env:
          OTA_KEY: ${{ secrets.DAYFORM_OTA_PRIVATE_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -n "${OTA_KEY}" ] || { echo "::error::Secret DAYFORM_OTA_PRIVATE_KEY is not set"; missing=1; }
          [ -n "${CF_TOKEN}" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is not set"; missing=1; }
          [ -n "${CF_ACCOUNT}" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is not set"; missing=1; }
          exit "${missing}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Read the runtime version
        id: runtime
        run: echo "version=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("packages/mobile/app.json","utf8")).expo.version)')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --linker hoisted --filter "@template/mobile" --filter "@template/web"

      - name: Tests (a failing test stops the update)
        working-directory: packages/mobile
        run: bun test

      - name: Typecheck
        working-directory: packages/mobile
        run: bunx tsc --noEmit && bunx tsc --noEmit -p tsconfig.test.json

      - name: Build and sign the update site
        working-directory: packages/mobile
        env:
          DAYFORM_OTA_PRIVATE_KEY: ${{ secrets.DAYFORM_OTA_PRIVATE_KEY }}
        run: bun ota/publish.ts --base-url "${OTA_BASE_URL}" --runtime-version "${{ steps.runtime.outputs.version }}" --out ../../ota-site

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy ota-site --project-name "${OTA_PROJECT}" --branch main --commit-dirty=true

      - name: Check the live manifest
        run: |
          sleep 15
          curl -fsS -D headers.txt -o manifest.json "${OTA_BASE_URL}/android/manifest.json"
          cat headers.txt
          grep -qi '^expo-protocol-version: 1' headers.txt || { echo "::error::expo-protocol-version header is missing on the live manifest"; exit 1; }
          grep -qi '^expo-signature: ' headers.txt || { echo "::error::expo-signature header is missing on the live manifest"; exit 1; }
          grep -q '"runtimeVersion":"${{ steps.runtime.outputs.version }}"' manifest.json || { echo "::error::live manifest has another runtime version"; exit 1; }
