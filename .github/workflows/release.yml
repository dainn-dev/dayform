name: Release

# Publishes a signed APK as a GitHub Release when a version tag is pushed:
#   git tag v1.0.8 && git push origin v1.0.8
# The in-app update check (lib/update-check.ts) reads this release, so the tag must equal
# `expo.version` in packages/mobile/app.json and the APK must be attached with the exact name below.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      NODE_ENV: production
      # Fail the build instead of silently producing a debug-signed release APK.
      DAYFORM_REQUIRE_RELEASE_SIGNING: "1"
      DAYFORM_KEYSTORE_PASSWORD: ${{ secrets.DAYFORM_KEYSTORE_PASSWORD }}
      DAYFORM_KEY_ALIAS: ${{ secrets.DAYFORM_KEY_ALIAS }}
      DAYFORM_KEY_PASSWORD: ${{ secrets.DAYFORM_KEY_PASSWORD }}
      # CPU architectures to build. arm64-v8a covers all phones sold in recent years; add armeabi-v7a/x86_64 if needed.
      DAYFORM_ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches the app version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/mobile/app.json').expo.version")
          CODE=$(node -p "require('./packages/mobile/app.json').expo.android.versionCode")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match expo.version ${VERSION} in packages/mobile/app.json"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.DAYFORM_KEYSTORE_BASE64 }}
        run: |
          for name in KEYSTORE_B64 DAYFORM_KEYSTORE_PASSWORD DAYFORM_KEY_ALIAS DAYFORM_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret for ${name}"; exit 1; fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;27.1.12297006"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: bun install --linker hoisted --filter "@template/mobile" --filter "@template/web"

      - name: Tests (a failing test stops the release)
        working-directory: packages/mobile
        run: bun test

      - name: Typecheck
        working-directory: packages/mobile
        run: bunx tsc --noEmit && bunx tsc --noEmit -p tsconfig.test.json

      - name: Restore the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DAYFORM_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dayform-release.jks"
          echo "DAYFORM_KEYSTORE_PATH=$RUNNER_TEMP/dayform-release.jks" >> "$GITHUB_ENV"

      - name: Generate the Android project
        working-directory: packages/mobile
        run: bunx expo prebuild --platform android --no-install --clean

      - name: Build the release APK
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease "-PreactNativeArchitectures=${DAYFORM_ABIS}" --no-daemon --console=plain

      - name: Verify the APK signature and version
        env:
          EXPECTED_CERT: ${{ vars.DAYFORM_CERT_SHA256 }}
        run: |
          APK=packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          CERT=$(grep -m1 "certificate SHA-256 digest" "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')
          echo "Signer SHA-256: ${CERT}"
          # Optional pin: set the repository variable DAYFORM_CERT_SHA256 (lower-case hex, no colons) to refuse any other key.
          if [ -n "${EXPECTED_CERT}" ] && [ "${CERT}" != "${EXPECTED_CERT}" ]; then
            echo "::error::APK is signed by ${CERT}, expected ${EXPECTED_CERT}"
            exit 1
          fi
          "$BT/aapt2" dump badging "$APK" | grep -m1 "^package:" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='${{ steps.version.outputs.version }}'" "$RUNNER_TEMP/badging.txt" \
            && grep -q "versionCode='${{ steps.version.outputs.code }}'" "$RUNNER_TEMP/badging.txt" \
            || { echo "::error::APK version does not match app.json"; exit 1; }
          cp "$APK" "dayform-${{ steps.version.outputs.version }}.apk"
          sha256sum "dayform-${{ steps.version.outputs.version }}.apk" > "dayform-${{ steps.version.outputs.version }}.apk.sha256"

      - name: Release notes
        run: bash scripts/release-notes.sh "${GITHUB_REF_NAME}" "dayform-${{ steps.version.outputs.version }}.apk.sha256" > release-notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dayform-${{ steps.version.outputs.version }}.apk" \
            "dayform-${{ steps.version.outputs.version }}.apk.sha256" \
            --title "Dayform ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag
